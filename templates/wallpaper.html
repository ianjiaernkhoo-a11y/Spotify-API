<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiosk — Wallpaper</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='wallpaper.css') }}">
</head>
<body>
  <div class="layer" id="layer-a">
    <div class="layer-bg"></div>
    <img class="layer-fg" alt="" />
  </div>
  <div class="layer" id="layer-b">
    <div class="layer-bg"></div>
    <img class="layer-fg" alt="" />
  </div>

  <div class="clock" id="clock">--:--</div>
  <div class="empty" id="empty" hidden>
    Drop photos into <code>static/wallpapers/</code> to see them here.
  </div>

  <a class="scene-switch" href="/kiosk" title="Switch to Now Playing">
    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M9 17V5.6L20 3v11.4M9 17a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm11-2.6a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM9 8.5 20 6"/>
    </svg>
  </a>

  <script src="{{ url_for('static', filename='wallpaper.js') }}"></script>
</body>
</html>
